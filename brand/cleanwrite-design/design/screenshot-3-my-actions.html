<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Screenshot 3: your own saved actions</title>
<!-- CleanWrite store asset · export at 1280x800 px -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0}
</style>

<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 72px; background: #F8FAFC; font-family: Inter, system-ui, sans-serif; color: #111827; display: flex; gap: 56px; align-items: center">
<div style="width: 470px; flex-shrink: 0; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 60px; line-height: 1.04; letter-spacing: -1.8px">Your prompts, <span style="background: #BEF264; border-radius: 12px; padding: 0 10px">one click</span> away.</h1>
<p style="margin: 0; font-size: 22px; line-height: 1.45; color: #475569">Type any instruction once and save it as a button. Reuse it on every page.</p>
</div>
<div style="flex-grow: 1; display: flex; justify-content: center">
<div style="width: 480px; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 20px; box-shadow: 0 24px 60px rgba(17, 24, 39, 0.14); padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #111827; font: 600 15px Inter, sans-serif">Fix</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #111827; font: 600 15px Inter, sans-serif">Rewrite</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #111827; font: 600 15px Inter, sans-serif">Summarize</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #111827; font: 600 15px Inter, sans-serif">Translate</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #111827; font: 600 15px Inter, sans-serif">Clean</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid #E2E8F0">
<div style="font-size: 13px; font-weight: 600; color: #475569">My actions</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #A3E635; background: #ECFCCB; color: #1A2E05; font: 600 15px Inter, sans-serif">Make it shorter</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #A3E635; background: #ECFCCB; color: #1A2E05; font: 600 15px Inter, sans-serif">Friendlier tone</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #A3E635; background: #ECFCCB; color: #1A2E05; font: 600 15px Inter, sans-serif">To bullet points</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #A3E635; background: #ECFCCB; color: #1A2E05; font: 600 15px Inter, sans-serif">Reply politely</button>
</div>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<label for="ask3" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Custom instruction</label>
<input id="ask3" type="text" value="Explain this like I am new to the topic" style="flex-grow: 1; height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 2px solid #111827; background: #FFFFFF; font: 400 15px Inter, sans-serif; color: #111827">
<button type="button" aria-label="Run instruction" style="width: 48px; height: 48px; border-radius: 12px; border: none; background: #BEF264; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#111827" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
</div>
<button type="button" style="align-self: flex-start; height: 44px; padding: 0 16px; border-radius: 12px; border: 1px dashed #64748B; background: #FFFFFF; color: #111827; font: 600 14px Inter, sans-serif; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#111827" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Save as action</button>
</div>
</div>
</div>
