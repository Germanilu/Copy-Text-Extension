<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CleanWrite</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="../ui/components.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>

  <body class="cw-root">
    <!-- AI not ready / not available -->
    <div id="aiNotice" class="notice" hidden>
      <span id="aiNoticeText"></span>
      <button id="enableAI" class="cw-link" hidden>Enable AI</button>
      <div id="aiProgress" class="cw-progress" hidden><div id="aiBar"></div></div>
    </div>

    <div id="error" class="cw-error" role="alert" hidden></div>

    <!-- State 1 · Actions -->
    <main id="viewActions" class="view">
      <div class="cw-row" id="actions" role="toolbar" aria-label="Actions">
        <button class="cw-pill" data-action="fix">Fix</button>
        <button class="cw-pill" data-action="rewrite" aria-expanded="false" aria-controls="tones">Rewrite</button>
        <button class="cw-pill" data-action="summarize">Summarize</button>
        <button class="cw-pill" data-action="translate">Translate</button>
        <button class="cw-pill" data-action="clean">Clean</button>
      </div>

      <div class="cw-row" id="tones" role="group" aria-label="Rewrite tone" hidden>
        <button class="cw-pill cw-pill--sm" data-tone="professional">Professional</button>
        <button class="cw-pill cw-pill--sm" data-tone="friendly">Friendly</button>
        <button class="cw-pill cw-pill--sm" data-tone="shorter">Shorter</button>
        <button class="cw-pill cw-pill--sm" data-tone="simpler">Simpler</button>
      </div>

      <form id="askForm" class="cw-ask">
        <label for="ask" class="cw-sr-only">Custom instruction</label>
        <input id="ask" class="cw-input" type="text" placeholder="Or tell it what to do…" autocomplete="off" />
        <button id="askBtn" class="cw-send" type="submit" aria-label="Run instruction">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="M13 6l6 6-6 6" /></svg>
        </button>
      </form>
    </main>

    <!-- State 2 · Loading -->
    <section id="viewBusy" class="view busy" hidden aria-live="polite">
      <span class="cw-spinner" aria-hidden="true"></span>
      <span id="busyText">Working…</span>
      <button id="cancelBtn" class="cw-btn busy-cancel">Cancel <kbd>Esc</kbd></button>
    </section>

    <!-- State 3 · Result -->
    <section id="viewResult" class="view" hidden>
      <div class="cw-result-head">
        <span id="resultLabel" class="cw-label"></span>
        <span id="resultSource" class="cw-source"></span>
      </div>
      <p id="resultText" class="cw-result-text" tabindex="0"></p>
      <div id="resultExtra" class="cw-row" hidden></div>
      <div class="cw-row">
        <button id="replaceBtn" class="cw-btn cw-btn--lime">Replace</button>
        <button id="copyBtn" class="cw-btn">Copy</button>
        <button id="retryBtn" class="cw-btn">Try again</button>
      </div>
    </section>

    <!-- No selection -->
    <section id="viewEmpty" class="view empty" hidden>
      <p>Select some text on the page first, then right-click → <strong>CleanWrite</strong>.</p>
    </section>

    <script type="module" src="panel.js"></script>
  </body>
</html>
